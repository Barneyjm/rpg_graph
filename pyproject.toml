[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rpg-graph"
version = "0.1.0"
description = "Vivarium - A solo RPG set on the desert moon Saharantis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-fireworks>=0.1.3",
    "langgraph>=0.6.0",
    "python-dotenv>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["rpg_graph"]
