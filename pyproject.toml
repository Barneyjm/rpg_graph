[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rpg-graph"
version = "0.1.0"
description = "Vivarium - A solo RPG set on the desert moon Saharantis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain",
    "langchain-fireworks",
    "langgraph",
    "python-dotenv",
]

[tool.hatch.build.targets.wheel]
packages = ["rpg_graph"]
